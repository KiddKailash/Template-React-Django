# Loaded into nginx's http{} context (conf.d/default.conf), so the maps and
# zones below are global. Hardening carried over from Store-Arbitrage.

# The real client address. Every proxy in front of this container (cloudflared,
# Caddy, docker-proxy for a published port) reaches it from a Docker bridge
# address, and cloudflared and Caddy both append the client to X-Forwarded-For.
# Trusting only the bridge range keeps $remote_addr (logs, limit_req below,
# and the X-Forwarded-For handed to Django) the client, not the gateway. A
# client that connects to the published port directly can spoof the header;
# that only moves its own rate-limit bucket, which is all it is used for.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Volumetric guard for /api/ and /admin/, per client. DRF's throttles
# (settings.REST_FRAMEWORK) are the per-endpoint budgets; this is the cheap
# outer wall, answered before a gunicorn thread is spent.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# The client's REAL scheme. TLS terminates in front of nginx (Cloudflare
# Tunnel, Caddy), so nginx's own $scheme is always "http". Forwarding that made
# Django think every request was plain HTTP; with DJANGO_BEHIND_TLS's
# SECURE_SSL_REDIRECT that is an endless redirect loop. Use the upstream
# proxy's X-Forwarded-Proto, falling back to $scheme for direct requests.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Keep the API, admin and static files out of search indexes.
map $uri $robots_tag {
    default    "";
    ~^/api/    "noindex, nofollow";
    ~^/admin/  "noindex, nofollow";
    ~^/static/ "noindex, nofollow";
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

server {
    listen 80;

    # Every byte nginx holds is charged to its container's cgroup (R4 gives it
    # mem_limit 64m), including page cache it writes and its sockets' kernel
    # buffers. Measured 2026-11-03 on pi-zone (stock nginx:alpine, 64 MB),
    # after andykidd-edge was OOM-killed that way:
    #   * Temp files. A request body over 16 KB, or a response that outgrows
    #     its buffers, is spooled to disk as dirty page cache, and a sender on
    #     the same host outruns writeback. One 100 MB response, or four 50 MB
    #     uploads even at 20 MB/s, kill nginx PID 1. A non-zero
    #     proxy_max_temp_file_size does not help: it caps the unsent part, but
    #     the whole response still goes through the file (16 concurrent 100 MB
    #     responses killed it at 1m). Responses are therefore never spooled.
    #     Past the buffers they stream, and the backend's and nginx's socket
    #     buffers still absorb a few MB, so a slow client does not hold a
    #     gunicorn thread on ordinary responses.
    #   * Socket buffers. Bounded at 512 KB by the nginx service's `sysctls:`
    #     in docker-compose.yml. TCP autotuning otherwise reaches ~6 MB per
    #     stalled download (8 stalled clients = 53 MB).
    #   * Request bodies up to 8m are spooled safely (eight at once peak under
    #     40 MB). Django caps JSON far lower (DATA_UPLOAD_MAX_MEMORY_SIZE,
    #     2.5 MB). A route that takes bigger FILE uploads gets its own location
    #     that streams the body instead of spooling it. Copy this into the
    #     server block, above `location /api/`, and fix the path and limit:
    #
    #       location ~ ^/api/things/[0-9]+/upload/$ {
    #           client_max_body_size 50m;
    #           proxy_request_buffering off;
    #           proxy_http_version 1.1;
    #           proxy_set_header Connection "";
    #           proxy_pass http://backend:8000;
    #           proxy_set_header Host $host;
    #           proxy_set_header X-Real-IP $remote_addr;
    #           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #           proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    #       }
    #
    #     Never raise client_max_body_size here instead: that spools every
    #     big body on every route.
    client_max_body_size 8m;
    proxy_max_temp_file_size 0;

    # Redirects (e.g. /admin -> /admin/) as paths, never absolute URLs: nginx
    # would build them from its own $scheme and port, which are wrong behind
    # a tunnel or a published port.
    absolute_redirect off;

    # Security headers for every response. NOTE: an `add_header` inside a
    # location REPLACES all of these for that location (nginx inheritance), so
    # cache lifetimes below use `expires`, which does not; a location that
    # needs its own add_header must repeat the ones it still wants (/media/).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Robots-Tag $robots_tag always;
    # Baseline CSP for a Vite + MUI SPA served same-origin with its API.
    # 'unsafe-inline' styles: MUI/Emotion injects <style> tags at runtime.
    # Add origins here when the app really loads from them (web fonts, an API
    # on another origin, image CDNs); a CSP violation shows in the console.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    root /usr/share/nginx/html;

    # SPA shell. Revalidated on every load (index.html, sw.js, the manifest),
    # so installed PWAs and open tabs discover a new build instead of running
    # the old shell from the HTTP cache (LLMStockAnalysis). `expires`, not
    # add_header, so the security headers above still apply.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Vite's content-hashed bundles never change at a given URL.
    location /assets/ {
        try_files $uri =404;
        expires max;
    }

    # User-uploaded media (mounted via docker volume). Bytes a person handed
    # the app: never sniffed into another type, never a document of this
    # origin (sandboxed CSP), never framed, never indexed. These add_headers
    # replace the server-level set for this location, hence the repeats.
    location /media/ {
        alias /app/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, noimageindex, nofollow" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Backend API
    location /api/ {
        limit_req zone=api burst=60 nodelay;

        proxy_pass http://backend:8000;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Django Admin
    location /admin/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://backend:8000;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # Django Static Files (served by WhiteNoise via Gunicorn)
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }
}
