[project]
name = "template-backend"
version = "0.1.0"
description = "Django + DRF backend template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "django-cors-headers",
    "dj-database-url>=2.3.0",
    "gunicorn>=23.0.0",
    "psycopg2-binary",
    "python-dotenv",
    "whitenoise>=6.6.0",
    "requests",
    # Testing + tooling
    "pytest>=9.1.0",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.14.1",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
django_find_project = true
addopts = "--cov=core --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "I", "UP"]
