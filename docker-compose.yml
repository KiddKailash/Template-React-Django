# ─────────────────────────────────────────────────────────────────────────────
#  CHANGEME — set this to your project name (lowercase, hyphens) before the
#  first deploy. deploy.yml fails the build while it still says "changeme".
#
#  This prefixes every container and named volume. It is a LITERAL, not a
#  variable, deliberately: a variable can be unset or mistyped at deploy time,
#  and a wrong project name silently creates EMPTY volumes — the app starts with
#  no data. A literal cannot be got wrong after the fact.
# ─────────────────────────────────────────────────────────────────────────────
name: changeme

services:
  chroma:
    image: chromadb/chroma:1.5.8
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    # R5: without this the backend can only wait for `service_started`, which
    # returns as soon as the process spawns — before Chroma can answer a query.
    # NOTE: this image has NO curl, wget, nc or python — bash + /dev/tcp is the
    # only dependency-free probe available. A curl-based check here never
    # succeeds, and with `service_healthy` below that HANGS THE DEPLOY.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    # R3: no ":-latest" fallback. That tag is never built, so the fallback only
    # ever produces a confusing pull error. ":?" fails immediately, with a fix.
    image: changeme-backend:${BACKEND_IMAGE_HASH:?set by deploy.yml - to run by hand, export the tag from `docker images`}
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Override local .env settings for Docker networking
      - DB_HOST=db
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_DEBUG=false
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - ./backend:/app
      - media_data:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    command:
      - sh
      - -c
      - "python manage.py collectstatic --noinput && python manage.py migrate && exec gunicorn --bind 0.0.0.0:8000 --timeout 60 --graceful-timeout 300 --threads 4 --max-requests 200 --max-requests-jitter 20 config.wsgi:application"

  nginx:
    image: nginx:alpine
    env_file:
      - ./frontend/.env
    ports:
      # R1: REQUIRED, no default. There is no safe default to pick — on pi-zone
      # port 80 already serves a live public site, and 8080 would just be a
      # guess. A missing value must stop the deploy, not silently choose.
      - "${NGINX_HOST_PORT:?NGINX_HOST_PORT is required - allocate one in pi-zone CLAUDE.md's port table}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - media_data:/app/media:ro
    depends_on:
      # R5: the short list form means `service_started`, so nginx begins serving
      # as soon as the backend PROCESS exists — up to the backend's 60 s
      # start_period before it can actually answer. That is a 502 window on
      # every single deploy. The backend has a healthcheck; wait for it.
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  chroma_data:
