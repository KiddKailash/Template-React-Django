name: Deploy to Pi 5
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Fix permissions from prior Docker run
        run: sudo chown -R $USER:$USER ${{ github.workspace }} || true

      # actions/checkout runs `git clean -ffdx`, which EMPTIES frontend/dist
      # (the committed .gitkeep preserves only the directory inode, keeping the
      # nginx bind mount alive). Without a stash the site serves an empty root
      # -- 403/404 on everything -- from checkout until the frontend build's
      # rsync lands: ~55s whenever the build actually runs. So: stash the
      # currently-served build aside, check out, and restore it immediately,
      # so the OLD assets keep serving while the NEW ones build.
      - name: Stash live frontend build
        run: |
          rm -rf "$RUNNER_TEMP/dist_keep"
          if [ -d frontend/dist ]; then cp -a frontend/dist "$RUNNER_TEMP/dist_keep"; fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore live frontend build
        run: |
          if [ -d "$RUNNER_TEMP/dist_keep" ]; then
            mkdir -p frontend/dist
            # rsync INTO the directory, never replace it: the bind mount follows
            # the inode it was created with (see the dist_new rsync below).
            rsync -a --exclude=.gitkeep "$RUNNER_TEMP/dist_keep/" frontend/dist/
            rm -rf "$RUNNER_TEMP/dist_keep"
          fi

      # ── PREFLIGHT ──────────────────────────────────────────────────────
      # A template ships defaults, and defaults get copied verbatim: this repo's
      # descendant Store-Arbitrage still published an image called "app-backend"
      # months after it stopped being a generic app. Fail the FIRST deploy until
      # the placeholders are replaced, rather than deploying something generic.
      - name: Preflight - placeholders replaced?
        run: |
          set -euo pipefail
          fail=0
          if grep -q '^name: changeme' docker-compose.yml; then
            echo "::error::docker-compose.yml still says 'name: changeme'."
            echo "Set it to your project name (lowercase, hyphens). It prefixes"
            echo "every container and named volume - choose it once, carefully."
            fail=1
          fi
          if grep -q 'image: changeme-backend' docker-compose.yml; then
            echo "::error::docker-compose.yml still uses the 'changeme-backend' image name."
            fail=1
          fi
          if grep -q 'PROJECT: changeme' .github/workflows/deploy.yml; then
            echo "::error::deploy.yml still has PROJECT: changeme."
            echo "It must match 'name:' in docker-compose.yml."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "Placeholders replaced."

      # ── STANDARD ENV STEP ──────────────────────────────────────────────
      # Compose interpolates ${VAR} in docker-compose.yml from the project-root
      # .env ONLY — never from an env_file:. So the root .env is layered:
      #   1. backend/.env           app config + credentials (secret)
      #   2. secrets.ROOT_ENV       compose-only vars absent from backend/.env
      #                             (POSTGRES_* — the backend uses DB_* names)
      #   3. ~/deploy/<project>.env  host-owned facts (NGINX_HOST_PORT), named
      #                              after PROJECT below
      # Duplicate keys resolve LAST-WINS, so the host file always beats a stale
      # value left inside a secret. Verified 2026-08-21.
      - name: Materialize env files
        env:
          PROJECT: changeme                 # MUST match `name:` in docker-compose.yml
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
          ROOT_ENV: ${{ secrets.ROOT_ENV }}
        run: |
          set -euo pipefail
          mkdir -p backend frontend
          printf '%s\n' "$BACKEND_ENV" > backend/.env
          chmod 600 backend/.env
          if [ -n "${FRONTEND_ENV:-}" ]; then
            printf '%s\n' "$FRONTEND_ENV" > frontend/.env
            chmod 600 frontend/.env
          fi
          # .env may be a symlink left by an earlier revision of this workflow;
          # remove it first so we never write through it into backend/.env.
          rm -f .env
          cat backend/.env > .env
          [ -n "${ROOT_ENV:-}" ] && printf '%s\n' "$ROOT_ENV" >> .env
          HOST_ENV="$HOME/deploy/${PROJECT}.env"
          if [ ! -r "$HOST_ENV" ]; then
            echo "::error::missing $HOST_ENV on the runner host - it supplies"
            echo "NGINX_HOST_PORT. See ~/deploy/README.md and the port table in ~/CLAUDE.md."
            exit 1
          fi
          cat "$HOST_ENV" >> .env
          chmod 600 .env
          grep -q '^NGINX_HOST_PORT=' .env || {
            echo "::error::NGINX_HOST_PORT unset after layering .env"; exit 1; }
          # Print the port ALONE, not as NGINX_HOST_PORT=<n>. Where that exact
          # line also lives inside a secret, Actions masks the whole string and
          # the confirmation reads "Resolved ***" -- useless as a pre-flight
          # check. The bare number is not a registered secret value.
          echo "Resolved host port -> $(grep '^NGINX_HOST_PORT=' .env | tail -1 | cut -d= -f2)"

      - name: Calculate Hashes
        id: hashes
        run: |
          # Hash dependency manifests so we can skip rebuilds when nothing changed.
          BACKEND_HASH=$(cat backend/pyproject.toml backend/uv.lock backend/Dockerfile 2>/dev/null | sha256sum | awk '{print $1}')
          echo "backend_hash=$BACKEND_HASH" >> $GITHUB_OUTPUT
          echo "frontend_hash=$(cat frontend/package.json frontend/package-lock.json frontend/Dockerfile 2>/dev/null | sha256sum | awk '{print $1}')" >> $GITHUB_OUTPUT
          # Make the resolved tag visible to every LATER step. Shell exports do
          # not survive across GitHub Actions steps, and docker-compose.yml now
          # requires BACKEND_IMAGE_HASH with no fallback (R3) -- so any later
          # `docker compose` call, `ps` included, dies on interpolation without
          # this. The root .env is rebuilt from scratch each run, so this cannot
          # go stale. It also makes the checkout on disk operable by hand.
          printf 'BACKEND_IMAGE_HASH=%s\n' "$BACKEND_HASH" >> .env

      - name: Build Frontend and Extract Assets
        run: |
          echo "Building frontend assets..."
          docker build --target build --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t changeme-frontend-builder:${{ steps.hashes.outputs.frontend_hash }} \
            ./frontend

          # Extract dist to a temp folder, then atomic swap into the nginx mount
          # to avoid 404s during extraction.
          docker create --name temp-frontend changeme-frontend-builder:${{ steps.hashes.outputs.frontend_hash }}
          docker cp temp-frontend:/app/dist ./frontend/dist_new
          docker rm temp-frontend

          command -v rsync >/dev/null || {
            echo "::error::rsync is not installed on this runner host."
            echo "The deploy syncs frontend/dist in place so the nginx bind mount"
            echo "stays valid. Install it: sudo apt-get install -y rsync"
            exit 1; }

          # rsync INTO the existing directory rather than mv-ing a new one over
          # it. `mv` replaces the directory inode, and a Docker bind mount
          # follows the inode it was created with -- so nginx kept serving the
          # OLD dist and had to be force-recreated to see the new one, which
          # unbinds the host port. Same class of bug as a single-file bind
          # mount going stale after an editor's atomic rename.
          #
          # --delete-after transfers everything new BEFORE removing anything
          # stale, so with content-hashed asset filenames a client mid-load
          # always finds the file it asked for.
          # frontend/dist/.gitkeep is COMMITTED (force-added past .gitignore) and
          # must stay. `actions/checkout` runs `git clean -ffdx`, which deletes
          # frontend/dist/ outright -- and a Docker bind mount follows the inode
          # it was created with, so nginx would then be mounted to a deleted
          # directory and serve 403/500 for everything. A tracked file inside
          # the directory makes git clean empty it instead of removing it, so
          # the inode survives and the mount stays live.
          mkdir -p ./frontend/dist
          rsync -a --delete-after --exclude=.gitkeep ./frontend/dist_new/ ./frontend/dist/
          rm -rf ./frontend/dist_new

      - name: Deploy (rolling, zero-downtime)
        env:
          BACKEND_HASH: ${{ steps.hashes.outputs.backend_hash }}
        run: |
          set -euo pipefail
          export BACKEND_IMAGE_HASH=$BACKEND_HASH

          # The image tag IS the dependency-cache key, so an existing tag means
          # there is nothing to build.
          if ! docker image inspect changeme-backend:${BACKEND_HASH} > /dev/null 2>&1; then
            echo "Backend dependencies changed. Building new backend image..."
            docker build -t changeme-backend:${BACKEND_HASH} ./backend
          else
            echo "Backend dependencies unchanged. Reusing changeme-backend:${BACKEND_HASH}."
          fi

          reload_nginx() {
            [ -n "$(docker compose ps -q nginx 2>/dev/null)" ] || return 0
            docker compose exec -T nginx nginx -s reload 2>/dev/null \
              || echo "::warning::nginx reload failed - upstreams may be stale"
          }

          # Record which backend container is serving now, so we can PROVE at the
          # end that it was actually replaced. Backend code is bind-mounted, so
          # a deploy that leaves the old container running updates the files on
          # disk and changes nothing that is executing -- and it goes green.
          # That has happened; do not rely on noticing it by eye.
          BEFORE_ID=$(docker compose ps -q backend 2>/dev/null | head -n1 || true)
          if [ -n "${BEFORE_ID:-}" ]; then
            BEFORE_STARTED=$(docker inspect -f '{{.State.StartedAt}}' "$BEFORE_ID")
          else
            BEFORE_STARTED=none
          fi

          # Infra first, and NEVER --force-recreate. Recreating `db` restarts
          # Postgres and drops every connection the backend holds -- that is
          # downtime, in the step that is supposed to avoid it. Compose still
          # recreates these if their definition actually changed.
          docker compose up -d --wait db chroma

          # ── Rolling replace of the backend ────────────────────────────────
          # Measured on pi-zone, store-arbitrage, ~5 req/s against /api/health/:
          #
          #   up -d --force-recreate backend   49.2% of requests failed,
          #                                    10.48s continuous outage
          #   this sequence                     0.3% (4 isolated requests),
          #                                     0.00s continuous outage
          #
          # `--no-recreate` is load-bearing in the first step: it leaves the
          # OLD replica serving while the new one starts and passes its
          # healthcheck. Without it compose recreates in place and there is
          # simply nothing to serve for the backend's full 60s start_period.
          #
          # The reload after every step is equally load-bearing. nginx resolves
          # `backend` once at config-load and caches the address, so after any
          # scale change it will happily proxy to a container that no longer
          # exists until told to re-resolve.
          # Roll by CONTAINER ID, never by parsing the -N name suffix: the
          # suffix is not extractable generically (dashes in the project name
          # shift the sort field), and compose numbers new replicas max+1
          # without ever refilling gaps, so the number says nothing about age.
          if [ -z "${BEFORE_ID:-}" ]; then
            # Cold start - nothing is serving, so there is nothing to roll.
            docker compose up -d --wait backend
            reload_nginx
          else
            # Temp replica (numbered max+1) starts and passes its healthcheck
            # while the old one keeps serving.
            docker compose up -d --no-recreate --scale backend=2 --wait backend
            reload_nginx
            NEW_ID=$(docker compose ps -q backend | grep -v "^${BEFORE_ID}" | head -n1)
            if [ -z "$NEW_ID" ]; then
              echo "::error::rolling scale-up produced no second replica; aborting"
              echo "with the old replica still serving."
              exit 1
            fi

            docker stop -t 15 "$BEFORE_ID"
            reload_nginx

            # Restart-in-place vs replace, decided by compose's own config-hash
            # label. The hash covers the fully resolved service config INCLUDING
            # env_file contents (verified on compose v5.1.3), so if the old
            # replica's hash equals the temp replica's -- created seconds ago
            # from the current definition -- a recreate would change nothing.
            # Code is bind-mounted, so a plain restart boots gunicorn on the new
            # code, and the container keeps its name: the -N suffix stays put
            # instead of climbing by one every deploy. Unequal hashes (new
            # image, changed env, compose edit) force a real replacement; the
            # suffix then climbs by one, which is unavoidable and harmless --
            # nothing on the host may key on the number.
            LBL='com.docker.compose.config-hash'
            OLD_HASH=$(docker inspect -f "{{index .Config.Labels \"$LBL\"}}" "$BEFORE_ID")
            NEW_HASH=$(docker inspect -f "{{index .Config.Labels \"$LBL\"}}" "$NEW_ID")
            if [ -n "$OLD_HASH" ] && [ "$OLD_HASH" = "$NEW_HASH" ]; then
              echo "Config unchanged - restarting old replica in place (name stays stable)"
              docker compose up -d --no-recreate --scale backend=2 --wait backend
            else
              echo "Config changed - replacing old replica"
              docker rm "$BEFORE_ID"
            fi
            reload_nginx

            # Scale-down removes the HIGHEST-numbered replica (verified on
            # compose v5.1.3) -- always the temp one -- so in the common case
            # the survivor is the restarted original.
            docker compose up -d --scale backend=1 backend
            reload_nginx
          fi

          # ── Assert the backend really was replaced ────────────────────────
          # The image tag is a hash of the dependency manifests, so it is
          # unchanged on most deploys and compose will happily decide there is
          # nothing to do. If the serving container did not restart, the new
          # code is NOT live -- fail loudly rather than report success.
          AFTER_ID=$(docker compose ps -q backend | head -n1)
          AFTER_STARTED=$(docker inspect -f '{{.State.StartedAt}}' "$AFTER_ID")
          if [ "$BEFORE_STARTED" = "$AFTER_STARTED" ]; then
            echo "::error::backend container was NOT replaced (still started $AFTER_STARTED)."
            echo "Backend code is bind-mounted, so the running gunicorn is still"
            echo "executing the PREVIOUS code. This deploy did not take effect."
            exit 1
          fi
          echo "Backend replaced: $BEFORE_STARTED -> $AFTER_STARTED"

          # nginx: converge WITHOUT --force-recreate. frontend/dist is now
          # rsynced in place, so the bind mount stays valid and new assets are
          # served immediately. Recreating nginx unbinds the host port for
          # ~1.9s -- measured, and it was the only reason the old sequence
          # needed to.
          docker compose up -d --wait nginx

          # Safety net. If the bind mount is ever stale -- .gitkeep lost, a
          # fresh clone, someone rm -rf'ing dist -- nginx serves an empty root
          # and EVERY request 403/500s while the container still looks healthy.
          # Detect that and repair it, rather than completing a green deploy on
          # a dead site. The repair costs ~2s of static-asset downtime, which
          # is the old behaviour and vastly better than shipping broken.
          if ! docker compose exec -T nginx test -f /usr/share/nginx/html/index.html 2>/dev/null; then
            echo "::warning::nginx bind mount is stale - recreating to re-establish it"
            docker compose up -d --force-recreate --wait nginx
          fi

      - name: Cleanup old images
        run: |
          docker system prune -f
          # Preserve the "keep-cache=true" labelled layers used by the deps stages.
          docker image prune -a -f --filter "until=24h" --filter "label!=keep-cache=true"

      - name: Seed Users
        run: |
          # Get the actual container name from docker-compose (project prefix varies).
          CONTAINER=$(docker compose ps -q backend | head -n1)
          if [ -z "$CONTAINER" ]; then
            echo "ERROR: could not find backend container"; exit 1
          fi
          docker exec -w /app "$CONTAINER" python manage.py seed_users || \
            (echo "ERROR: seed_users failed" && exit 1)
